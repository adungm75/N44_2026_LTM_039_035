# E7 (P0) faults, part 3: frame error probability per transmission attempt (all nodes), raised
# until bus-off. Values chosen around the TEC drift limit p = 1/9 (+8 per error, -1 per success).
base: config/experiments/E0_baseline.yaml
name: E7_error
description: Per-attempt frame error probability at every sender, up to bus-off.
traces: first
sim:
  faults: [{error_prob: 0.0}]
sweep:
  sim.faults.0.error_prob: [0.001, 0.01, 0.05, 0.10, 0.12, 0.15, 0.20]
